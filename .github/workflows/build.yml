name: Build

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decky's frozen runtime is older than the 3.13 the main job uses, and the
  # README promises 3.10+, so the backend is also tested on those.
  backend-older-python:
    runs-on: ubuntu-latest
    # A regression that hangs a test fails here instead of after six hours.
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check the backend parses
        run: python -m compileall -q main.py lego_updater.py vibrance_*.py

      - name: Backend tests
        run: python -W error -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    # A regression that hangs a test fails here instead of after six hours.
    timeout-minutes: 15
    steps:
      # Pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the backend parses
        run: python -m compileall -q main.py lego_updater.py vibrance_*.py

      - name: Backend tests
        run: python -W error -m unittest discover -s tests -v

      - name: Check versions agree
        run: |
          plugin=$(python -c "import json;print(json.load(open('plugin.json'))['version'])")
          pkg=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          echo "plugin.json=$plugin package.json=$pkg"
          test "$plugin" = "$pkg"
          # The updater derives the asset name from the tag and rejects a ZIP
          # whose manifest disagrees, so a mismatched tag is an uninstallable release.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$plugin"
            # A release whose changelog still opens with [Unreleased] was not dated.
            grep -m1 '^## \[' CHANGELOG.md | grep -q "^## \[$plugin\]"
          fi

      - name: Install
        run: npm ci

      - name: Audit build dependencies
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend state regression tests
        run: npm test

      - name: Package
        run: npm run package

      - name: Verify built frontend and ZIP payload
        run: npm run verify:package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DeckyVibranceHDR
          path: "*.zip"
